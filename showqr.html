    <!-- Biblioteka QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Funkcja sendTo zostawiona na wszelki wypadek (jeśli dolny navbar jej używa)
        function sendTo(page) {
            if (page === 'qr') {
                window.location.href = 'scanqr.html';
            } else if (page === 'home') {
                window.location.href = 'home.html';
            } else {
                window.location.href = page + '.html';
            }
        }

        function generateQRCode() {
            const qrContainer = document.getElementById('qrCodeContainer');
            const codeNumbers = document.getElementById('codeNumbers');
            qrContainer.innerHTML = '';
            
            const randomCode = Math.floor(100000 + Math.random() * 900000);
            const shortData = `${randomCode};${Math.random().toString(36).substring(2, 10)};${Math.floor(Date.now()/1000)}`;
            
            codeNumbers.textContent = randomCode;

            new QRCode(qrContainer, {
                text: shortData,
                width: 280,
                height: 280,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L,
                version: 5
            });
        }

        function startTimer() {
            let timeLeft = 180;
            const timerElement = document.getElementById('timer');
            const loadingBar = document.getElementById('loadingBar');
            
            const interval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    generateQRCode();
                    startTimer();
                    return;
                }
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes} min ${seconds} sek.`;
                loadingBar.style.width = `${(timeLeft / 180) * 100}%`;
            }, 1000);
        }

        function waitForQRCodeLibrary(callback) {
            if (typeof QRCode !== 'undefined') {
                callback();
            } else {
                setTimeout(() => waitForQRCodeLibrary(callback), 100);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            waitForQRCodeLibrary(() => {
                generateQRCode();
                startTimer();
            });
        });
    </script>
