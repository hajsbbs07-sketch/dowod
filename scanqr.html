<!DOCTYPE html>
<html lang="pl">
<head>
    <script>
(function sprawdzOchrona() {
    const czyZalogowany = localStorage.getItem("mobywatel_dostep");
    const czyZapamietany = localStorage.getItem("mobywatel_zapamietany");

    // Jeśli ma dostęp, pozwól załadować stronę
    if (czyZalogowany === "przyznany" || czyZapamietany === "true") {
        return;
    }
    // Jeśli nie ma dostępu, wyrzuć go na ekran logowania (a nie do generatora)
    window.location.href = "index.html";
})();
</script>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiIiwic2hvcnRfbmFtZSI6IiIsInRoZW1lX2NvbG9yIjoiIzEwMTMxNyIsImJhY2tncm91bmRfY29sb3IiOiIjMTAxMzE3IiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <title>mObywatel</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assets/css/main2.css">
    <link rel="stylesheet" href="assets/css/scan.css">
    <link rel="icon" type="image/x-icon" href="assets/img/orzel.png">
    <link rel="apple-touch-icon" href="assets/img/orzel.png">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="assets/js/html5-qrcode.min.js"></script>
</head>
<body>
    <!-- Górny pasek – teraz naprawdę wraca wstecz -->
    <div class="top_grid_fixed">
        <div class="action_grid_fixed">
            <img src="assets/img/back_blue.png" class="back_img">
            <p onclick="history.back()" class="back_text" style="cursor: pointer;">Wróć</p>
        </div>
        <p class="title_text_fixed">Zeskanuj kod QR</p>
        <img src="assets/img/help.png" class="help_img">
    </div>

    <div class="container">
        <p class="description">Umieść kod QR w ramce, aby go zeskanować.</p>
        
        <div class="scan-frame">
            <div class="warning-box">
                <div class="warning-content">
                    <span class="warning-icon">!</span>
                    <p class="warning-text">Upewnij się, że kod QR pochodzi z wiarygodnego źródła.</p>
                    <span class="warning-close">×</span>
                </div>
            </div>
            <div id="reader" style="position: relative;"></div>
            <div class="frame-border">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>

        <button class="manual-input">Wpisz kod</button>
    </div>

    <!-- Dolny navbar – teraz działa poprawnie -->
    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('services')">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_element_image qr_open qr"></div>
                <p class="bottom_element_text open">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('more')">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <!-- Reszta elementów (input kodu, error itd.) bez zmian -->
    <div class="error">
        <div class="opacity"></div>
        <div class="error_box" style="display: none;"></div>
    </div>

    <div class="code-input-container">
        <div class="code-input-overlay"></div>
        <div class="code-input-box">
            <div class="code-input-header">
                <span class="code-input-title">Kod</span>
                <span class="code-input-close" onclick="closeCodeInput()">Zamknij</span>
            </div>
            <p class="code-input-subtitle">Wpisz lub wklej kod.</p>
            <div class="code-input-field-container">
                <input type="number" class="code-input-field" placeholder=" " maxlength="6">
            </div>
            <button class="code-input-submit" onclick="submitCode()" disabled>Dalej</button>
        </div>
    </div>

    <script>
        // Nawigacja – teraz używa onclick bezpośrednio w HTML lub tej funkcji
        function sendTo(page) {
            if (page === 'qr') {
                window.location.href = 'showqr.html';
            } else if (page === 'home') {
                window.location.href = 'home.html';
            } else if (page === 'services') {
                window.location.href = 'services.html';
            } else if (page === 'more') {
                window.location.href = 'more.html';
            } else {
                window.location.href = page + '.html';
            }
        }

        // Zamykanie ostrzeżenia
        document.querySelector('.warning-close').addEventListener('click', () => {
            document.querySelector('.warning-box').style.display = 'none';
        });

        // Pozostała logika skanera bez zmian
        function onScanSuccess(decodedText) {
            // ... (reszta kodu skanera bez zmian)
            fetch('/qr/validate?', {
                method: 'POST',
                body: JSON.stringify({ 'qrCode': decodedText })
            })
            .then(r => r.json())
            .then(result => {
                html5QrCode.stop();
                if (result.found) {
                    askForPermission(null, decodedText);
                } else {
                    showError();
                }
            })
            .catch(() => showError());
        }

        function onScanFailure() { /* cicho */ }

        let html5QrCode;
        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
                .catch(() => html5QrCode.start({ facingMode: "user" }, config, onScanSuccess, onScanFailure));
        }

        function askForPermission(code, qrCode) {
            if (code) localStorage.setItem('code', code);
            if (qrCode) localStorage.setItem('qrCode', qrCode);
            sendTo('share');
        }

        function showError() {
            // ... (kod błędu bez zmian)
        }

        function closeCodeInput() {
            document.querySelector('.code-input-container').classList.remove('active');
            setTimeout(() => {
                document.querySelector('.code-input-field').value = '';
            }, 300);
        }

        function submitCode() {
            const value = document.querySelector('.code-input-field').value;
            if (value.length === 6) {
                // ... logika wysyłania kodu
            }
        }

        // Start skanera po załadowaniu strony
        document.addEventListener('DOMContentLoaded', initScanner);

        // Ręczne wprowadzanie kodu
        document.querySelector('.manual-input').addEventListener('click', () => {
            document.querySelector('.code-input-container').classList.add('active');
            document.querySelector('.code-input-field').focus();
        });

        document.querySelector('.code-input-overlay').addEventListener('click', closeCodeInput);

        document.querySelector('.code-input-field').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
            document.querySelector('.code-input-submit').disabled = e.target.value.length !== 6;
        });
    </script>
</body>
</html>
