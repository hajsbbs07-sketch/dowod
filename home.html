    <script>
    (function sprawdzOchrona() {
        const czyZalogowany = localStorage.getItem("mobywatel_dostep");
        const tokenWPamieci = localStorage.getItem("user_token");
        const tokenWLinku = new URLSearchParams(window.location.search).get('token');

        // Sprawdzamy czy user przeszedł przez ekran logowania
        if (czyZalogowany !== "przyznany") {
            window.location.href = "index.html"; // Brak logowania -> na ekran hasła
            return;
        }

        // Sprawdzamy czy ma w ogóle przypisany jakikolwiek dowód (token)
        if (!tokenWPamieci && !tokenWLinku) {
            window.location.href = "gen.html"; // Brak dowodu -> wygeneruj nowy
        }
    })();
</script>
